# Merge these costmap blocks into the robot's complete Nav2 parameter file.
local_costmap:
  local_costmap:
    ros__parameters:
      plugins: ["obstacle_layer", "semantic_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: points
        points:
          topic: /points
          data_type: "PointCloud2"
          marking: true
          clearing: true
          obstacle_max_range: 10.0
          raytrace_max_range: 12.0
      semantic_layer:
        plugin: "semantic_costmap_layer/SemanticCostmapLayer"
        enabled: true
        topic: /semantic_costmap
        maximum_age: 1.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.60
        cost_scaling_factor: 3.0

global_costmap:
  global_costmap:
    ros__parameters:
      plugins: ["static_layer", "semantic_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      semantic_layer:
        plugin: "semantic_costmap_layer/SemanticCostmapLayer"
        enabled: true
        topic: /semantic_global_costmap
        maximum_age: 2.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.60
        cost_scaling_factor: 3.0
