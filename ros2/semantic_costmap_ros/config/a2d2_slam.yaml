a2d2_replay:
  ros__parameters:
    image_dir: data/raw/a2d2_playback/camera
    lidar_dir: data/raw/a2d2_playback/lidar
    bus_json: data/raw/a2d2_playback/bus/20180807145028_bus_signals.json
    calibration: configs/a2d2_cams_lidars.json
    # CPU U-Net inference takes roughly 1.5 s on the reference laptop. Slow
    # replay prevents the finite sample from outrunning perception and SLAM.
    publish_rate: 0.5
    loop: false
    # Use current ROS time during live replay. Nav2 intentionally rejects stale
    # costmaps, so publishing the original 2018 timestamps would make the
    # semantic layer ignore every replayed observation.
    timestamp_mode: now
    camera_frame: front_center_camera
    base_frame: base_link
    odom_frame: odom

pointcloud_to_laserscan:
  ros__parameters:
    target_frame: base_link
    transform_tolerance: 0.1
    min_height: -1.0
    max_height: 1.5
    angle_min: -3.14159
    angle_max: 3.14159
    angle_increment: 0.00872665
    scan_time: 0.2
    range_min: 0.3
    range_max: 50.0
    use_inf: true
    inf_epsilon: 1.0

slam_toolbox:
  ros__parameters:
    solver_plugin: solver_plugins::CeresSolver
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    mode: mapping
    resolution: 0.2
    map_update_interval: 1.0
    transform_publish_period: 0.05
    # Recorded odometry is published only once per frame. Do not future-date
    # map->odom beyond the newest odom->base_link sample during replay.
    transform_timeout: 0.0
    minimum_time_interval: 0.1
    max_laser_range: 50.0
    minimum_travel_distance: 0.1
    minimum_travel_heading: 0.1
    use_scan_matching: true
    use_scan_barycenter: true
